<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Metas de Venda</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="tela-login">
  <main class="login-box">
    <div class="login-cabecalho">
      <div class="login-titulo">Metas de Venda</div>
      <div class="login-sub">Cini Pgo</div>
    </div>
    <form id="form-login">
      <label>E-mail
        <input id="inp-email" type="email" autocomplete="username" required placeholder="seu@email.com">
      </label>
      <label>Senha
        <input id="inp-senha" type="password" autocomplete="current-password" required placeholder="Sua senha">
      </label>
      <button class="btn primario bloco" type="submit">Entrar</button>
      <p class="erro hidden" id="erro-login"></p>
    </form>
    <div style="text-align:center; padding: 0 0 4px;">
      <button id="btn-login-info" style="background:none; border:none; font-size:1.4rem; cursor:pointer; opacity:0.5;" title="Informações do sistema">ℹ️</button>
    </div>
  </main>

  <div id="modal-info" class="modal hidden">
    <div class="modal-box">
      <h3>Metas de Venda — Cini Pgo</h3>
      <p style="font-size:0.85rem; color:#475569; line-height:1.6; margin-bottom:14px;">
        Sistema de acompanhamento de vendas com metas diárias e mensais, painéis individual e de equipe, relatórios e gráficos.
      </p>
      <p style="font-size:0.82rem; color:#64748b; line-height:1.6;">
        <b style="color:#334155;">Desenvolvido por</b><br>
        Darci Oliveira
      </p>
      <div class="modal-acoes">
        <button class="btn primario" id="btn-info-fechar">Fechar</button>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>

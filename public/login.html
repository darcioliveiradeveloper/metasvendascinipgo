<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VendaCerta — Entrar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="tela-login">
  <main class="login-box">
    <div class="login-cabecalho">
      <div class="login-titulo">VendaCerta</div>
      <div class="login-sub">Acompanhamento de Vendas</div>
      <div class="login-versao"><span>v2.1.0</span></div>
    </div>
    <form id="form-login">
      <label>E-mail
        <input id="inp-email" type="email" autocomplete="username" required placeholder="seu@email.com">
      </label>
      <label>Senha
        <input id="inp-senha" type="password" autocomplete="current-password" required placeholder="Sua senha">
      </label>
      <button class="btn primario bloco" type="submit">Entrar</button>
      <p class="erro hidden" id="erro-login"></p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
